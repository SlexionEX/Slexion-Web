<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="/favicon.ico">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
    <title>Slexion | Cyberpunk Resource Station</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#050118 url("/pic/cyberbg.png") no-repeat center center fixed;
            background-size:cover;
            color:#e0e0e0;
            font-family:sans-serif;
            position:relative;
        }
        /* ===== Liquid Glass 背景彩色光晕（让玻璃有东西可透） ===== */
        .blobs{
            position:fixed;
            inset:-10%;
            z-index:0;
            pointer-events:none;
            background:
                radial-gradient(circle at 15% 20%, rgba(0,255,255,0.30), transparent 42%),
                radial-gradient(circle at 85% 25%, rgba(255,0,255,0.26), transparent 42%),
                radial-gradient(circle at 50% 85%, rgba(60,110,255,0.32), transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(140,60,255,0.24), transparent 40%);
            filter:blur(22px);
            animation:blobFloat 16s ease-in-out infinite alternate;
        }
        @keyframes blobFloat{
            0%{transform:translate(0,0) scale(1);}
            100%{transform:translate(3%,2%) scale(1.06);}
        }
        /* ===== Liquid Glass 材质 ===== */
        .container{
            max-width:900px;
            margin:20px auto 40px;
            padding:0 20px;
        }
        .cyber-title{
            font-size:42px;
            color:#0ff;
            text-shadow:0 0 10px #0ff;
        }
        .glitch-line{
            height:3px;
            background:#f0f;
            margin:15px 0;
            box-shadow:0 0 10px #f0f;
        }
        .cyber-sub{
            color:#aaa;
            margin-bottom:30px;
        }
        .card{
            background:rgba(255,255,255,0.05);
            -webkit-backdrop-filter:blur(18px) saturate(180%) brightness(1.12);
            backdrop-filter:blur(18px) saturate(180%) brightness(1.12);
            border:1px solid rgba(255,255,255,0.14);
            border-left:4px solid #0ff;
            box-shadow:inset 0 1px 0 rgba(255,255,255,0.28), inset 0 -1px 0 rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.40);
            padding:25px;
            margin:20px 0;
            position:relative;
            overflow:hidden;
            border-radius:16px;
        }
        .card::before{
            content:"";
            position:absolute;
            top:0;left:0;right:0;height:45%;
            background:linear-gradient(180deg,rgba(255,255,255,0.09),transparent);
            pointer-events:none;
        }
        .cyber-btn{
            background:#0ff;
            color:#000;
            padding:12px 24px;
            margin-top:15px;
            text-decoration:none;
            font-weight:bold;
            border:none;
            cursor:pointer;
            display:inline-block;
            position:relative;
            z-index:10;
        }
    </style>
</head>
<body>

<div class="blobs"></div>

<div class="container">
    <h1 class="cyber-title">SLEXION RESOURCE</h1>
    <div class="glitch-line"></div>
    <p class="cyber-sub">OFFICIAL NETWORK INSTALLER & WINDOWS IMAGE STATION</p>
<p data-zh="现在Slexion支持在Windows上显示" data-en="Now, Slexion CAN Show">Now, Slexion CAN Show</p><i class="fa-brands fa-apple" style="font-size:260px;color:#0ff;"></i><p data-zh="了！" data-en="on windows!"> on windows!</p>
    <div class="card">
        <h3 data-zh="工具包下载" data-en="Download Toolkit">Download Toolkit</h3>
        <h4 data-zh="这是整合了实用工具的工具盒子" data-en="This Toolkit has a lot of handy tools">This Toolkit is have a lot of manyuse tools</h4>
        <a href="https://slexion.com/download/msi/ST1.8x64setup.exe" class="cyber-btn">DOWNLOAD TOOLKIT</a>
    </div>

    <div class="card">
        <h3>Slexion Browser</h3>
        <p data-zh="使用Qt Widgets，QWebEngine做的浏览器没有广告" data-en="Use Qt Widgets, QWebEngine to make a browser, no ads.">Use Qt Widgets，QWebEngine make browser, no ads.</p>
        <a href="/browser" class="cyber-btn" data-zh="关于Slexion Browser" data-en="About Slexion Browser">关于Slexion Browser</a>
    </div>
</div>

<script>window.__i18nDefault = 'en';</script>
<script src="/navbar.js"></script>
<script src="/account/auth.js"></script>
<script src="/i18n.js"></script>
<script src="/account.js"></script>
</body>
</html>
